<section id="home" class="hero" aria-labelledby="hero-heading">
  <div class="container hero-shell">
    <div class="hero-copy">
      <p class="hero-eyebrow">{{ t("hero.eyebrow") }}</p>
      <h1 id="hero-heading">{{ t("hero.greeting") }}</h1>
      <p class="hero-role">{{ t("hero.role") }}</p>
      <p class="hero-title">{{ t("hero.title") }}</p>
      <p class="hero-description">{{ t("hero.description") }}</p>
      <div class="hero-actions">
        <a href="#experience" class="hero-action primary">{{ t("hero.viewWork") }} <span aria-hidden="true">↘</span></a>
        <a href="/assets/Hazem_Ragab_Resume.pdf" class="hero-action secondary" target="_blank" rel="noopener noreferrer">{{ t("hero.downloadResume") }} <span aria-hidden="true">↗</span></a>
      </div>
      <nav class="hero-social" [attr.aria-label]="t('hero.socialLabel')">
        <a href="https://github.com/rhazem13" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        <a href="https://www.linkedin.com/in/hazem-ragab-mohammed/" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">↗</span></a>
        <a href="mailto:h.ragab.dev@gmail.com">{{ t("hero.email") }} <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
    <aside class="system-note" aria-hidden="true" dir="ltr">
      <div class="system-note-heading"><span>SYSTEMS</span><span>BACKEND</span></div>
      <div class="system-path">
        <div><span>01</span><strong>API</strong></div>
        <div><span>02</span><strong>REAL-TIME</strong></div>
        <div><span>03</span><strong>STATE</strong></div>
        <div><span>04</span><strong>OBSERVABILITY</strong></div>
      </div>
    </aside>
  </div>
</section>
