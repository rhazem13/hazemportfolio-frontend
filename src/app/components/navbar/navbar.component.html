<nav class="navbar" aria-label="Primary navigation">
  <div class="nav-content">
    <a class="logo" href="#home" aria-label="Hazem Ragab, home" (click)="closeMenu()">
      <span class="logo-mark" aria-hidden="true">HR</span>
      <span class="logo-name">Hazem Ragab</span>
    </a>
    <div class="nav-right">
      <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen"
        aria-controls="primary-navigation"
        [attr.aria-label]="isMenuOpen ? (currentLang() === 'en' ? 'Close menu' : 'إغلاق القائمة') : (currentLang() === 'en' ? 'Open menu' : 'فتح القائمة')">
        <span></span>
        <span></span>
      </button>
      <ul id="primary-navigation" class="nav-links" [class.is-open]="isMenuOpen">
        <li>
          <a href="#experience" (click)="closeMenu()">{{ t("nav.experience") }}</a>
        </li>
        <li>
          <a href="#projects" (click)="closeMenu()">{{ t("nav.projects") }}</a>
        </li>
        <li>
          <a href="#skills" (click)="closeMenu()">{{ t("nav.skills") }}</a>
        </li>
        <li>
          <a href="#contact" (click)="closeMenu()">{{ t("nav.contact") }}</a>
        </li>
      </ul>
      <div class="nav-actions">
        <button class="lang-toggle" (click)="toggleLanguage()" [attr.aria-label]="
            currentLang() === 'en'
              ? 'Switch to Arabic'
              : 'التبديل إلى الإنجليزية'
          ">
          <span class="lang-text">{{
            currentLang() === "en" ? "عربي" : "EN"
            }}</span>
        </button>
        <button class="theme-toggle" type="button" (click)="toggleTheme()"
          [attr.aria-label]="isDark ? 'Use light theme' : 'Use dark theme'" [attr.aria-pressed]="isDark">
          <span aria-hidden="true">{{ isDark ? "☀" : "☾" }}</span>
        </button>
      </div>
    </div>
  </div>
</nav>
