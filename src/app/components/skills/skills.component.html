<section id="skills" class="skills" aria-labelledby="skills-heading">
  <div class="container">
    <header class="skills-heading">
      <span class="section-kicker" data-index="03">Capabilities</span>
      <h2 id="skills-heading" class="section-title">What I work with</h2>
      <p class="section-subtitle">Tools I have used to build, ship and debug backend systems.</p>
    </header>

    <div class="skills-grid">
      @for (category of skillCategories; track category.title) {
      <article class="skill-category">
        <h3>{{ category.title }}</h3>
        <ul>
          @for (skill of category.skills; track skill.name) {
          <li>{{ skill.name }}</li>
          }
        </ul>
      </article>
      }
    </div>
  </div>
</section>
