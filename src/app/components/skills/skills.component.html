<section id="skills" class="skills" aria-labelledby="skills-heading">
  <div class="container">
    <header class="skills-heading">
      <span class="section-kicker">{{ t("skills.kicker") }}</span>
      <h2 id="skills-heading" class="section-title">{{ t("skills.title") }}</h2>
      <p class="section-subtitle">{{ t("skills.subtitle") }}</p>
    </header>

    <div class="skills-grid">
      @for (category of skillCategories; track category.titleEn) {
      <article class="skill-category">
        <h3>{{ getCategoryTitle(category) }}</h3>
        <ul>
          @for (skill of category.skills; track skill.name) {
          <li>{{ getSkillName(skill) }}</li>
          }
        </ul>
      </article>
      }
    </div>
  </div>
</section>
