<section id="education" class="education-section">
  <div class="container">
    <header class="section-heading">
      <span class="section-kicker" data-index="04">Foundation</span>
      <h2 class="section-title">Education</h2>
      <p class="section-subtitle">Computer science foundations and hands-on training.</p>
    </header>
    <div class="education-timeline">
      @for (item of educationItems; track item; let i = $index) {
      <article class="education-item">
        <div class="icon-container" aria-hidden="true">
          <span>{{ i === 0 ? "BSc" : "ITI" }}</span>
        </div>
        <div class="education-content">
          <h3 class="degree">{{ item.degree }}</h3>
          <div class="institution-year">
            <span class="institution">{{ item.institution }}</span>
            <span class="year">{{ item.year }}</span>
          </div>
          <p class="details">{{ item.details }}</p>
        </div>
      </article>
      }
    </div>
  </div>
</section>
