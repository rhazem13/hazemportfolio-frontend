<section id="education" class="education-section">
  <div class="container">
    <header class="section-heading">
      <span class="section-kicker">{{ t("education.kicker") }}</span>
      <h2 class="section-title">{{ t("education.title") }}</h2>
      <p class="section-subtitle">{{ t("education.subtitle") }}</p>
    </header>
    <div class="education-timeline">
      @for (item of educationItems; track item; let i = $index) {
      <article class="education-item">
        <div class="icon-container" aria-hidden="true">
          <span>{{ i === 0 ? "BSc" : "ITI" }}</span>
        </div>
        <div class="education-content">
          <h3 class="degree">{{ getDegree(item) }}</h3>
          <div class="institution-year">
            <span class="institution">{{ getInstitution(item) }}</span>
            <span class="year">{{ item.year }}</span>
          </div>
          <p class="details">{{ getDetails(item) }}</p>
        </div>
      </article>
      }
    </div>
  </div>
</section>
